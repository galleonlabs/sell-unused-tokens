name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Link health depends on live tokensto.cash URLs, which can break with no commit
  # here. Re-check daily so that drift surfaces on its own.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Installability
        run: bash scripts/validate.sh installability

      - name: Link health
        run: bash scripts/validate.sh links

      - name: Payload disclosure
        run: bash scripts/validate.sh payload

      - name: Pin freshness
        run: bash scripts/validate.sh pin
